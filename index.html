<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>21天课程日历</title>
    <style>
        :root {
            --bg1: #fffaf2;
            --bg2: #f2e4d2;
            --card: rgba(255, 255, 255, 0.86);
            --text: #5a4335;
            --muted: #8d7360;
            --line: rgba(155, 122, 96, 0.22);
            --accent: #9b6f4b;
            --accent-soft: #e8d2bd;
            --done: #2f8f5b;
            --done-bg: #e7f7ef;
            --shadow: 0 14px 30px rgba(98, 73, 54, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(circle at top, var(--bg1), var(--bg2) 52%, #ead6c1 100%);
            color: var(--text);
            padding: 20px 14px 28px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 顶部装饰光晕 ===== */
        body::before {
            content: '';
            position: fixed;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201,168,98,0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            width: min(100%, 430px);
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== Hero 区域 ===== */
        .hero {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 18px 16px 16px;
            margin-bottom: 14px;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            color: #7d5c46;
            background: #fff3e6;
            border: 1px solid #f0dac3;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 22px;
            line-height: 1.35;
            margin-bottom: 6px;
            color: #5d4334;
        }

        .desc {
            font-size: 13px;
            line-height: 1.7;
            color: var(--muted);
            margin-bottom: 14px;
        }

        /* ===== Stats ===== */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat {
            background: #fffaf5;
            border: 1px solid #f1dfcd;
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 800;
            color: #6e4f3b;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px;
        }

        /* ===== 进度条 ===== */
        .progress-bar {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #f0e5d8;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #8d6b4d, #c9a862, #7a9a5a);
            transition: width 0.6s ease;
            width: 0%;
        }

        /* ===== 按钮 ===== */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn:active { transform: scale(0.97); }

        .btn.reset {
            background: #fff0ec;
            color: #9a4f3f;
            border: 1px solid #f0ccc4;
        }

        .btn.today {
            background: linear-gradient(135deg, #9b6f4b, #b68862);
            color: #fff;
            box-shadow: 0 6px 16px rgba(155,111,75,0.25);
        }

        .btn.today.completed {
            background: linear-gradient(135deg, #5a8a5a, #7aaa6a);
            box-shadow: 0 6px 16px rgba(90,138,90,0.25);
        }

        /* ===== 周区块 ===== */
        .week {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 14px 12px 12px;
            margin-bottom: 14px;
        }

        .week-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .week-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }

        /* 第1周：雾中苏醒 */
        .week.w1 .week-num { background: linear-gradient(135deg, #8d6b4d, #a78267); }
        /* 第2周：站稳脚跟 */
        .week.w2 .week-num { background: linear-gradient(135deg, #8d6b4d, #c9a862); }
        /* 第3周：走进生活 */
        .week.w3 .week-num { background: linear-gradient(135deg, #7a9a5a, #a0b870); }

        .week-title {
            font-size: 14px;
            font-weight: 700;
            color: #6a4b37;
            line-height: 1.3;
        }

        .week-sub {
            font-size: 11px;
            color: var(--muted);
            margin-top: 1px;
        }

        /* ===== 三列网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        /* ===== 日卡片 ===== */
        .day {
            text-decoration: none;
            color: inherit;
            background: #fff9f2;
            border: 1px solid var(--line);
            border-radius: 14px;
            min-height: 88px;
            padding: 10px 8px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform .15s ease, box-shadow .2s ease;
            cursor: pointer;
        }

        .day:active { transform: scale(0.97); }

        .day-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .day-num {
            font-size: 11px;
            color: #7e624f;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        /* 完成勾 */
        .day-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1.5px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: transparent;
            transition: all 0.3s ease;
        }

        .day.done .day-check {
            background: var(--done);
            border-color: var(--done);
            color: #fff;
            box-shadow: 0 2px 6px rgba(47,143,91,0.25);
        }

        .day-name {
            font-size: 12px;
            color: #5f4838;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            flex: 1;
        }

        .day-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }

        .state {
            font-size: 10px;
            border-radius: 999px;
            padding: 2px 7px;
            background: #f4e7d9;
            color: #86664f;
        }

        .day-date {
            font-size: 9px;
            color: var(--muted);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .day.done .day-date { opacity: 1; }

        /* ===== 完成状态 ===== */
        .day.done {
            background: var(--done-bg);
            border-color: #a9dfc3;
        }

        .day.done .state {
            background: #c9f0da;
            color: var(--done);
            font-weight: 700;
        }

        /* ===== 今日推荐（呼吸脉动） ===== */
        .day.today {
            border-color: #be906d;
            animation: today-pulse 2.5s ease-in-out infinite;
        }

        @keyframes today-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(190,144,109,0.3); }
            50% { box-shadow: 0 0 0 6px rgba(190,144,109,0); }
        }

        .day.today.done {
            animation: none;
            box-shadow: none;
            border-color: #a9dfc3;
        }

        /* ===== 页脚 ===== */
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.7;
            margin-top: 8px;
        }

        /* ===== 全部完成庆祝 ===== */
        .all-done .hero::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            left: -2px;
            bottom: -2px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(201,168,98,0.3), rgba(122,154,90,0.3));
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="wrap" id="app">
        <section class="hero">
            <div class="badge">21天课程日历索引</div>
            <h1>每天一点点，慢慢把自己找回来</h1>
            <div class="desc">点击当天卡片进入练习。每次在课程页面点击"完成今天的练习"后，会自动在这里标记为已完成。</div>
            <div class="stats">
                <div class="stat">
                    <div id="doneCount" class="stat-value">0</div>
                    <div class="stat-label">已完成</div>
                </div>
                <div class="stat">
                    <div id="leftCount" class="stat-value">21</div>
                    <div class="stat-label">待完成</div>
                </div>
                <div class="stat">
                    <div id="rate" class="stat-value">0%</div>
                    <div class="stat-label">完成率</div>
                </div>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div class="actions">
                <button class="btn reset" onclick="resetProgress()">重置打卡</button>
                <button id="todayBtn" class="btn today" onclick="goToday()">去今日建议</button>
            </div>
        </section>

        <section class="week w1">
            <div class="week-header">
                <div class="week-num">1</div>
                <div>
                    <div class="week-title">奠基与确认</div>
                    <div class="week-sub">身体扫描 · 看见感受</div>
                </div>
            </div>
            <div id="week1" class="grid"></div>
        </section>

        <section class="week w2">
            <div class="week-header">
                <div class="week-num">2</div>
                <div>
                    <div class="week-title">内在重建</div>
                    <div class="week-sub">步行冥想 · 宣言强化</div>
                </div>
            </div>
            <div id="week2" class="grid"></div>
        </section>

        <section class="week w3">
            <div class="week-header">
                <div class="week-num">3</div>
                <div>
                    <div class="week-title">行动整合</div>
                    <div class="week-sub">边界设定 · 自我供养</div>
                </div>
            </div>
            <div id="week3" class="grid"></div>
        </section>

        <div class="footer-note">遇到使用问题请联系管理员</div>
    </div>

    <script>
        const lessons = [
            { day: 1, name: '停下来，看见感受', file: '第1天：练习-停下来，看见自己的感受.html', week: 1 },
            { day: 2, name: '卡桑德拉式无效化', file: '第2天：什么是卡桑德拉式无效化.html', week: 1 },
            { day: 3, name: '停止自我责备', file: '第3天：停止自我责备.html', week: 1 },
            { day: 4, name: '情感无效化代价', file: '第4天：情感无效化的代价（调整版）.html', week: 1 },
            { day: 5, name: '对方为什么看不见', file: '第5天：对方为什么"看不见".html', week: 1 },
            { day: 6, name: '我的情绪有价值', file: '第6天：我的情绪有价值.html', week: 1 },
            { day: 7, name: '阶段复盘+第一道光', file: '第7天：阶段复盘 + 第一道光.html', week: 1 },

            { day: 8, name: '给内在小孩写信', file: '第8天：给内在小孩写信.html', week: 2 },
            { day: 9, name: '自我宣言强化（一）', file: '第9天：自我宣言强化周（一）.html', week: 2 },
            { day: 10, name: '自我宣言强化（二）', file: '第10天：自我宣言强化周（二）.html', week: 2 },
            { day: 11, name: '自我宣言强化（三）', file: '第11天：自我宣言强化周（三）.html', week: 2 },
            { day: 12, name: '情绪命名与接纳', file: '第12天：情绪命名与接纳.html', week: 2 },
            { day: 13, name: '自我价值独立', file: '第13天：自我价值独立.html', week: 2 },
            { day: 14, name: '中期大复盘', file: '第14天：中期大复盘.html', week: 2 },

            { day: 15, name: '设定情感边界', file: '第15天：设定情感边界.html', week: 3 },
            { day: 16, name: '带着情绪行动', file: '第16天：带着情绪行动.html', week: 3 },
            { day: 17, name: '外部支持网络', file: '第17天：外部支持网络.html', week: 3 },
            { day: 18, name: '沟通vs自我保护', file: '第18天：沟通尝试 vs 自我保护.html', week: 3 },
            { day: 19, name: '情感自我供养', file: '第19天：情感自我供养日常.html', week: 3 },
            { day: 20, name: '允许自己需要帮助', file: '第20天：允许自己需要帮助.html', week: 3 },
            { day: 21, name: '复盘与未来承诺', file: '第21天：复盘与未来的承诺.html', week: 3 }
        ];

        function isDone(day) {
            return localStorage.getItem('act21_day_' + day) === 'done';
        }

        function getDoneDate(day) {
            const ts = localStorage.getItem('act21_day_' + day + '_date');
            if (ts) {
                const d = new Date(ts);
                return (d.getMonth() + 1) + '/' + d.getDate();
            }
            return '';
        }

        function renderWeek(week, targetId) {
            const container = document.getElementById(targetId);
            container.innerHTML = '';
            lessons.filter(item => item.week === week).forEach(item => {
                const a = document.createElement('a');
                a.href = '#';
                a.className = 'day';
                a.dataset.day = item.day;
                a.dataset.file = item.file;
                a.addEventListener('click', function (event) {
                    event.preventDefault();
                    openLesson(item.file);
                });
                if (isDone(item.day)) a.classList.add('done');
                const doneDate = getDoneDate(item.day);
                a.innerHTML =
                    '<div class="day-top">' +
                        '<div class="day-num">Day ' + item.day + '</div>' +
                        '<div class="day-check">✓</div>' +
                    '</div>' +
                    '<div class="day-name">' + item.name + '</div>' +
                    '<div class="day-bottom">' +
                        '<div class="state">' + (isDone(item.day) ? '已完成' : '未完成') + '</div>' +
                        '<div class="day-date">' + (doneDate || '') + '</div>' +
                    '</div>';
                container.appendChild(a);
            });
        }

        function renderStats() {
            const done = lessons.filter(item => isDone(item.day)).length;
            const left = lessons.length - done;
            const rate = Math.round((done / lessons.length) * 100);
            document.getElementById('doneCount').textContent = done;
            document.getElementById('leftCount').textContent = left;
            document.getElementById('rate').textContent = rate + '%';
            document.getElementById('progressFill').style.width = rate + '%';

            const todayBtn = document.getElementById('todayBtn');
            if (done === 21) {
                todayBtn.textContent = '恭喜完成21天';
                todayBtn.classList.add('completed');
                document.getElementById('app').classList.add('all-done');
            } else {
                todayBtn.textContent = '去今日建议';
                todayBtn.classList.remove('completed');
                document.getElementById('app').classList.remove('all-done');
            }
        }

        function markSuggestedDay() {
            const firstNotDone = lessons.find(item => !isDone(item.day));
            const day = firstNotDone ? firstNotDone.day : 21;
            const card = document.querySelector('.day[data-day="' + day + '"]');
            if (card) card.classList.add('today');
        }

        function goToday() {
            const firstNotDone = lessons.find(item => !isDone(item.day));
            const target = firstNotDone || lessons[lessons.length - 1];
            openLesson(target.file);
        }

        function openLesson(fileName) {
            const safePath = encodeURI(fileName);
            window.location.href = safePath;
        }

        function resetProgress() {
            if (!confirm('确定要清空 21 天打卡记录吗？')) return;
            for (let i = 1; i <= 21; i++) {
                localStorage.removeItem('act21_day_' + i);
                localStorage.removeItem('act21_day_' + i + '_date');
            }
            localStorage.removeItem('act21_lastCompletedAt');
            init();
        }

        function init() {
            renderWeek(1, 'week1');
            renderWeek(2, 'week2');
            renderWeek(3, 'week3');
            renderStats();
            markSuggestedDay();
        }

        // 监听 localStorage 变化（同标签页内其他页面完成练习后自动刷新）
        window.addEventListener('storage', function (e) {
            if (e.key && e.key.startsWith('act21_day_')) {
                init();
            }
        });

        init();
    </script>
</body>
</html>
